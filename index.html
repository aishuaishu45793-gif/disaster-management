<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RakshaNet-X | Multi-Hazard Disaster Management Platform</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
      :root {
        --bg: #f4f6f9;
        --panel: #ffffff;
        --panel-2: #eef1f6;
        --text: #101828;
        --muted: #5b6472;
        --border: #e1e5ec;
        --accent: #1d4ed8;
        --accent-2: #0ea5e9;
        --good: #16a34a;
        --warn: #d97706;
        --bad: #dc2626;
        --crit: #991b1b;
        --shadow:
          0 1px 3px rgba(16, 24, 40, 0.08), 0 1px 2px rgba(16, 24, 40, 0.06);
        --radius: 12px;
        --font:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      }
      :root:not([data-theme="light"]) {
        @media (prefers-color-scheme: dark) {
          --bg: #0b0f17;
          --panel: #121826;
          --panel-2: #1a2233;
          --text: #e7ecf5;
          --muted: #93a0b4;
          --border: #232d40;
          --accent: #3b82f6;
          --accent-2: #22d3ee;
          --good: #22c55e;
          --warn: #f59e0b;
          --bad: #ef4444;
          --crit: #f87171;
          --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.3);
        }
      }
      :root[data-theme="dark"] {
        --bg: #0b0f17;
        --panel: #121826;
        --panel-2: #1a2233;
        --text: #e7ecf5;
        --muted: #93a0b4;
        --border: #232d40;
        --accent: #3b82f6;
        --accent-2: #22d3ee;
        --good: #22c55e;
        --warn: #f59e0b;
        --bad: #ef4444;
        --crit: #f87171;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.3);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 8px;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        background: linear-gradient(135deg, #0f2653, #132a63 60%, #0ea5e9);
        color: #fff;
        position: sticky;
        top: 0;
        z-index: 500;
        box-shadow: var(--shadow);
        flex-wrap: wrap;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        font-size: 20px;
      }
      .brand .logo {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 19px;
        border: 1px solid rgba(255, 255, 255, 0.35);
      }
      .brand small {
        display: block;
        font-weight: 500;
        font-size: 11px;
        opacity: 0.85;
      }
      .topbar .spacer {
        flex: 1;
      }
      .clock {
        font-size: 12px;
        opacity: 0.9;
        text-align: right;
        line-height: 1.3;
      }
      .theme-btn,
      .siren-btn,
      .mute-btn {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #fff;
        border-radius: 8px;
        padding: 7px 10px;
        cursor: pointer;
        font-size: 13px;
      }
      .theme-btn:hover,
      .siren-btn:hover,
      .mute-btn:hover {
        background: rgba(255, 255, 255, 0.22);
      }
      .siren-btn.live {
        background: var(--bad);
        border-color: var(--bad);
        animation: pulseBtn 1s infinite;
      }
      @keyframes pulseBtn {
        0%,
        100% {
          filter: brightness(1);
        }
        50% {
          filter: brightness(1.5);
        }
      }

      .tabs {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        padding: 8px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 60px;
        z-index: 400;
      }
      .tabs::-webkit-scrollbar {
        height: 5px;
      }
      .tab-btn {
        flex: 0 0 auto;
        padding: 9px 14px;
        border-radius: 9px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: 0.15s;
      }
      .tab-btn:hover {
        background: var(--panel-2);
        color: var(--text);
      }
      .tab-btn.active {
        background: var(--accent);
        color: #fff;
        box-shadow: var(--shadow);
      }

      .wrap {
        max-width: 1400px;
        margin: 0 auto;
        padding: 18px 16px 60px;
      }
      .view {
        display: none;
        animation: fade 0.25s ease;
      }
      .view.active {
        display: block;
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      h1.page-title {
        font-size: 21px;
        margin: 2px 0 4px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .page-sub {
        color: var(--muted);
        font-size: 13.5px;
        margin: 0 0 18px;
      }

      .grid {
        display: grid;
        gap: 14px;
      }
      .g-4 {
        grid-template-columns: repeat(4, 1fr);
      }
      .g-3 {
        grid-template-columns: repeat(3, 1fr);
      }
      .g-2 {
        grid-template-columns: repeat(2, 1fr);
      }
      @media (max-width: 980px) {
        .g-4 {
          grid-template-columns: repeat(2, 1fr);
        }
        .g-3 {
          grid-template-columns: 1fr 1fr;
        }
        .g-2 {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 600px) {
        .g-4 {
          grid-template-columns: 1fr;
        }
        .g-3 {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        box-shadow: var(--shadow);
      }
      .card h3 {
        margin: 0 0 12px;
        font-size: 14.5px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card h3 .tag {
        font-weight: 600;
        font-size: 11px;
        color: var(--muted);
        margin-left: auto;
      }

      .stat-card {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .stat-card .icon {
        font-size: 22px;
      }
      .stat-card .num {
        font-size: 26px;
        font-weight: 800;
      }
      .stat-card .lbl {
        color: var(--muted);
        font-size: 12.5px;
        font-weight: 600;
      }
      .stat-card.b-red {
        border-left: 4px solid var(--bad);
      }
      .stat-card.b-amber {
        border-left: 4px solid var(--warn);
      }
      .stat-card.b-blue {
        border-left: 4px solid var(--accent);
      }
      .stat-card.b-green {
        border-left: 4px solid var(--good);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 9px;
        border-radius: 20px;
        font-size: 11.5px;
        font-weight: 700;
      }
      .b-LOW {
        background: rgba(22, 163, 74, 0.15);
        color: var(--good);
      }
      .b-MEDIUM {
        background: rgba(217, 119, 6, 0.15);
        color: var(--warn);
      }
      .b-HIGH {
        background: rgba(220, 38, 38, 0.15);
        color: var(--bad);
      }
      .b-CRITICAL {
        background: rgba(153, 27, 27, 0.2);
        color: var(--crit);
      }
      .b-waiting {
        background: rgba(217, 119, 6, 0.15);
        color: var(--warn);
      }
      .b-assigned {
        background: rgba(14, 165, 233, 0.15);
        color: var(--accent-2);
      }
      .b-rescued {
        background: rgba(22, 163, 74, 0.15);
        color: var(--good);
      }

      .btn {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 9px 14px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.15s;
      }
      .btn:hover {
        filter: brightness(1.08);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn.sm {
        padding: 6px 10px;
        font-size: 12px;
        border-radius: 6px;
      }
      .btn.outline {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
      }
      .btn.good {
        background: var(--good);
      }
      .btn.warn {
        background: var(--warn);
      }
      .btn.bad {
        background: var(--bad);
      }
      .btn.block {
        width: 100%;
      }

      label {
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        display: block;
        margin: 10px 0 4px;
      }
      input[type="text"],
      input[type="number"],
      input[type="tel"],
      select,
      textarea {
        width: 100%;
        padding: 9px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--text);
        font-size: 13.5px;
        font-family: var(--font);
      }
      input[type="file"] {
        width: 100%;
        font-size: 12.5px;
        color: var(--muted);
      }
      textarea {
        resize: vertical;
        min-height: 60px;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid var(--accent);
        outline-offset: 0;
      }
      .check-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
      }
      .check-pill {
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 6px 12px;
        font-size: 12.5px;
        cursor: pointer;
        user-select: none;
        background: var(--panel-2);
      }
      .check-pill.on {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th {
        text-align: left;
        color: var(--muted);
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        padding: 8px 6px;
        border-bottom: 1px solid var(--border);
      }
      td {
        padding: 9px 6px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      tr:last-child td {
        border-bottom: none;
      }
      .table-wrap {
        overflow-x: auto;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .hr {
        height: 1px;
        background: var(--border);
        margin: 14px 0;
      }

      .pill-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .pill {
        border: 1px solid var(--border);
        background: var(--panel-2);
        border-radius: 22px;
        padding: 8px 14px;
        cursor: pointer;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--muted);
      }
      .pill.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .progress {
        height: 8px;
        border-radius: 6px;
        background: var(--panel-2);
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .progress > div {
        height: 100%;
        background: var(--accent);
      }

      .alert-item {
        border-left: 4px solid var(--bad);
        background: var(--panel-2);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 8px;
      }
      .alert-item.MEDIUM {
        border-color: var(--warn);
      }
      .alert-item.LOW {
        border-color: var(--good);
      }
      .alert-item.CRITICAL {
        border-color: var(--crit);
      }
      .alert-item .t {
        font-size: 11px;
        color: var(--muted);
      }

      .toast {
        position: fixed;
        bottom: 18px;
        right: 18px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-left: 4px solid var(--good);
        border-radius: 10px;
        padding: 12px 16px;
        box-shadow: var(--shadow);
        max-width: 320px;
        z-index: 900;
        font-size: 13px;
        animation: fade 0.2s ease;
      }
      .toast.CRITICAL {
        border-left-color: var(--crit);
      }

      .leaflet-map {
        width: 100%;
        height: 420px;
        border-radius: 10px;
        border: 1px solid var(--border);
        z-index: 1;
      }
      .leaflet-map.small {
        height: 260px;
      }
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 11.5px;
        margin-top: 10px;
        color: var(--muted);
      }
      .legend span.dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 5px;
      }
      .divmarker {
        border-radius: 50%;
        border: 2px solid #fff;
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.2);
      }
      .divmarker.pulse {
        animation: markerPulse 1.1s infinite;
      }
      @keyframes markerPulse {
        0% {
          box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.6);
        }
        70% {
          box-shadow: 0 0 0 14px rgba(220, 38, 38, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(220, 38, 38, 0);
        }
      }

      .side-panel {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        font-size: 13px;
      }
      .photo-preview {
        max-width: 140px;
        border-radius: 8px;
        border: 1px solid var(--border);
        margin-top: 6px;
        display: block;
      }

      .chatlog {
        height: 300px;
        overflow-y: auto;
        background: var(--panel-2);
        border-radius: 10px;
        padding: 12px;
        border: 1px solid var(--border);
        margin-bottom: 10px;
      }
      .msg {
        max-width: 80%;
        padding: 8px 12px;
        border-radius: 12px;
        margin-bottom: 8px;
        font-size: 13.5px;
        line-height: 1.4;
      }
      .msg.bot {
        background: var(--panel);
        border: 1px solid var(--border);
        border-bottom-left-radius: 2px;
      }
      .msg.me {
        background: var(--accent);
        color: #fff;
        margin-left: auto;
        border-bottom-right-radius: 2px;
      }

      .foot {
        text-align: center;
        color: var(--muted);
        font-size: 11.5px;
        margin-top: 30px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
      }
      .risk-gauge {
        text-align: center;
        padding: 10px 0;
      }
      .risk-gauge .score {
        font-size: 44px;
        font-weight: 900;
      }
      .risk-gauge .lvl {
        font-size: 15px;
        font-weight: 800;
        margin-top: 2px;
      }
      .two-col {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 14px;
      }
      @media (max-width: 900px) {
        .two-col {
          grid-template-columns: 1fr;
        }
      }
      .inline-flex {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 12px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        font-weight: 700;
        color: var(--muted);
      }
      .critical-banner {
        background: var(--crit);
        color: #fff;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 12px;
        display: none;
      }
      .critical-banner.show {
        display: block;
      }
      thumb-img {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">
        <div class="logo">🛡️</div>
        <div>
          RakshaNet-X<small>AI Multi-Hazard Disaster Command Platform</small>
        </div>
      </div>
      <div class="spacer"></div>
      <button class="siren-btn" id="sirenBtn" type="button">
        🔇 Siren Off
      </button>
      <div class="clock" id="clockBox">—</div>
      <button class="theme-btn" id="themeToggle" type="button">🌓 Theme</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="wrap" id="views"></div>
    <div id="toastHost"></div>

    <script>
      /* =====================================================================
   RAKSHANET-X — fully client-side multi-hazard disaster management app.
   Real Leaflet GPS maps, live browser geolocation capture for SOS,
   photo/age/situation intake, siren alarm, and route drawing from a
   citizen's live location to the nearest hospital on critical cases.
   Data persists to localStorage per-browser. Every action here really
   mutates state and re-renders — nothing is a static screenshot.
   ===================================================================== */

      /* ---------------------------- THEME ---------------------------- */
      (function () {
        try {
          const s = localStorage.getItem("rn_theme");
          if (s) document.documentElement.setAttribute("data-theme", s);
        } catch (e) {}
      })();
      document.getElementById("themeToggle").addEventListener("click", () => {
        const cur = document.documentElement.getAttribute("data-theme");
        const next = cur === "dark" ? "light" : cur === "light" ? "" : "dark";
        if (next) document.documentElement.setAttribute("data-theme", next);
        else document.documentElement.removeAttribute("data-theme");
        try {
          localStorage.setItem("rn_theme", next);
        } catch (e) {}
      });

      /* ---------------------------- CLOCK ---------------------------- */
      function tickClock() {
        const d = new Date();
        document.getElementById("clockBox").innerHTML =
          d.toLocaleDateString(undefined, {
            weekday: "short",
            day: "2-digit",
            month: "short",
            year: "numeric",
          }) +
          "<br>" +
          d.toLocaleTimeString();
      }
      tickClock();
      setInterval(tickClock, 1000);

      /* ---------------------------- SIREN (Web Audio, no external files) ---------------------------- */
      const Siren = (function () {
        let ctx = null,
          osc = null,
          gain = null,
          lfo = null,
          playing = false;
        function ensureCtx() {
          if (!ctx) {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
          }
          return ctx;
        }
        function start() {
          if (playing) return;
          try {
            ensureCtx();
            if (ctx.state === "suspended") ctx.resume();
            osc = ctx.createOscillator();
            gain = ctx.createGain();
            lfo = ctx.createOscillator();
            const lfoGain = ctx.createGain();
            osc.type = "sawtooth";
            osc.frequency.value = 600;
            lfo.type = "sine";
            lfo.frequency.value = 0.6;
            lfoGain.gain.value = 350;
            lfo.connect(lfoGain);
            lfoGain.connect(osc.frequency);
            gain.gain.value = 0.06;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            lfo.start();
            playing = true;
            document.getElementById("sirenBtn").classList.add("live");
            document.getElementById("sirenBtn").innerHTML = "🔊 Stop Siren";
          } catch (e) {
            console.warn("Siren unavailable", e);
          }
        }
        function stop() {
          if (!playing) return;
          try {
            osc.stop();
            lfo.stop();
          } catch (e) {}
          playing = false;
          document.getElementById("sirenBtn").classList.remove("live");
          document.getElementById("sirenBtn").innerHTML = "🔇 Siren Off";
        }
        function toggle() {
          playing ? stop() : start();
        }
        return { start, stop, toggle, isPlaying: () => playing };
      })();
      document
        .getElementById("sirenBtn")
        .addEventListener("click", Siren.toggle);

      /* ---------------------------- GEO HELPERS ---------------------------- */
      function haversineKm(lat1, lon1, lat2, lon2) {
        const R = 6371,
          dLat = ((lat2 - lat1) * Math.PI) / 180,
          dLon = ((lon2 - lon1) * Math.PI) / 180;
        const a =
          Math.sin(dLat / 2) ** 2 +
          Math.cos((lat1 * Math.PI) / 180) *
            Math.cos((lat2 * Math.PI) / 180) *
            Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }
      function nearestFacility(lat, lng, list) {
        let best = null,
          bestD = Infinity;
        list.forEach((f) => {
          const d = haversineKm(lat, lng, f.lat, f.lng);
          if (d < bestD) {
            bestD = d;
            best = f;
          }
        });
        return best ? { ...best, distanceKm: bestD } : null;
      }

      /* ---------------------------- STATE ---------------------------- */
      const ZONES = [
        {
          id: "A",
          name: "Zone A · Riverside (Yelahanka)",
          lat: 13.1007,

      /* ---------------------------- RISK ENGINE ----------------------------
   Transparent, explainable weighted-scoring model (not a black box).
   This is a rule-based prototype standing in for a trained classifier —
   described honestly as such, not as a live ML model.
------------------------------------------------------------------------ */
      function clampNorm(v, max) {
        v = Number(v) || 0;
        return Math.max(0, Math.min(100, (v / max) * 100));
      }
      function computeRisk(hazardId, inputs) {
        let score = 0;
        switch (hazardId) {
          case "flood":
            score =
              0.4 * clampNorm(inputs.rainfall, 220) +
              0.4 * clampNorm(inputs.waterLevel, 7) +
              0.2 * clampNorm(inputs.soilMoisture, 100);
            break;
          case "flashflood":
            score =
              0.55 * clampNorm(inputs.rainfall, 150) +
              0.3 * clampNorm(inputs.waterLevel, 5) +
              0.15 * clampNorm(inputs.drainage, 100);
            break;
          case "landslide":
            score =
              0.35 * clampNorm(inputs.rainfall, 220) +
              0.35 * clampNorm(inputs.soilMoisture, 100) +
              0.3 * clampNorm(inputs.slope, 60);
            break;
          case "cyclone":
            score =
              0.55 * clampNorm(inputs.windSpeed, 220) +
              0.3 * clampNorm(inputs.rainfall, 220) +
              0.15 * clampNorm(inputs.pressureDrop, 60);
            break;
          case "rainfall":
            score =
              0.6 * clampNorm(inputs.rainfall, 220) +
              0.4 * clampNorm(inputs.duration, 48);
            break;
          case "urbanflood":
            score =
              0.45 * clampNorm(inputs.rainfall, 180) +
              0.3 * clampNorm(inputs.drainage, 100) +
              0.25 * clampNorm(inputs.waterLevel, 4);
            break;
          case "fire":
            score =
              0.35 * clampNorm(Math.max(0, inputs.temperature - 15), 30) +
              0.35 * (100 - clampNorm(inputs.humidity, 100)) +
              0.3 * clampNorm(inputs.windSpeed, 120);
            break;
          case "heatwave":
            score =
              0.6 * clampNorm(Math.max(0, inputs.temperature - 24), 22) +
              0.4 * clampNorm(inputs.humidity, 100);
            break;
          default:
            score = 0;
        }
        score = Math.round(Math.max(0, Math.min(100, score)));
        let level = "LOW";
        if (score >= 80) level = "CRITICAL";
        else if (score >= 55) level = "HIGH";
        else if (score >= 30) level = "MEDIUM";
        return { score, level };
      }
      function recommendedActions(level) {
        const base = {
          LOW: ["Continue routine monitoring", "No public action required"],
          MEDIUM: [
            "Increase monitoring frequency",
            "Alert local ward officers",
            "Pre-position basic supplies",
          ],
          HIGH: [
            "Issue public advisory",
            "Prepare evacuation centers",
            "Put rescue teams on standby",
          ],
          CRITICAL: [
            "Issue emergency warning",
            "Begin evacuation",
            "Deploy rescue teams",
            "Move medical & relief supplies to shelters",
          ],
        };
        return base[level];
      }
      function riskColor(level) {
        return {

      /* ========================= LEAFLET MAP ENGINE ========================= */
      const MapRegistry = {}; // containerId -> { map, layer }
      function getOrCreateMap(containerId) {
        if (MapRegistry[containerId] && MapRegistry[containerId].map)
          return MapRegistry[containerId];
        const container = document.getElementById(containerId);
        if (!container) return null;
        const map = L.map(containerId, { scrollWheelZoom: true }).setView(
          [13.02, 77.62],
          10.4,
        );
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: "&copy; OpenStreetMap contributors",
        }).addTo(map);
        const layer = L.layerGroup().addTo(map);
        MapRegistry[containerId] = { map, layer };
        return MapRegistry[containerId];
      }
      function divIcon(color, symbol, pulse) {
        return L.divIcon({
          className: "",
          html: `<div class="divmarker${pulse ? " pulse" : ""}" style="width:26px;height:26px;background:${color};display:flex;align-items:center;justify-content:center;font-size:14px;">${symbol}</div>`,
          iconSize: [26, 26],
          iconAnchor: [13, 13],
        });
      }
      function renderMap(containerId) {
        const reg = getOrCreateMap(containerId);
        if (!reg) return;
        reg.layer.clearLayers();

        STATE.zones.forEach((z) => {
          const color = riskHex(z.riskLevel);
          L.circle([z.lat, z.lng], {
            radius: 2600,
            color,
            fillColor: color,
            fillOpacity: 0.25,
            weight: 2,
          }).addTo(reg.layer);
          const m = L.marker([z.lat, z.lng], {
            icon: divIcon(color, "⬤", false),
          }).addTo(reg.layer);
          m.bindPopup(
            `<b>${z.name}</b><br>Population: ${z.population.toLocaleString()}<br>Hazard: ${z.hazard}<br>Risk: <b>${z.riskLevel}</b> (${z.riskScore}/100)`,
          );
          m.on("click", () => showZoneDetail(z.id));
        });
        STATE.shelters.forEach((s) => {
          const m = L.marker([s.lat, s.lng], {
            icon: divIcon("#0ea5e9", "🏠", false),
          }).addTo(reg.layer);
          m.bindPopup(
            `<b>🏠 ${s.name}</b><br>${s.occupied}/${s.capacity} occupied${s.medical ? "<br>🏥 Medical support on site" : ""}`,
          );
        });
        STATE.hospitals.forEach((h) => {
          const m = L.marker([h.lat, h.lng], {
            icon: divIcon("#16a34a", "🏥", false),
          }).addTo(reg.layer);
          m.bindPopup(`<b>🏥 ${h.name}</b>`);
        });
        STATE.teams.forEach((t) => {
          const z = zoneById(t.zoneId);
          const sym = t.vehicle.startsWith("Boat")
            ? "🚤"
            : t.vehicle.startsWith("Fire")
              ? "🚒"
              : t.vehicle.startsWith("Amb")
                ? "🚑"
                : "🚓";
          const m = L.marker([z.lat + 0.01, z.lng + 0.01], {
            icon: divIcon(
              t.status === "available" ? "#1d4ed8" : "#94a3b8",
              sym,
              false,
            ),
          }).addTo(reg.layer);
          m.bindPopup(
            `<b>${t.name}</b><br>${t.vehicle}<br>Status: ${t.status}`,
          );
        });
        STATE.sos
          .filter((s) => s.status !== "rescued")
          .forEach((s) => {
            const lat = s.gps ? s.gps.lat : zoneById(s.zoneId).lat;
            const lng = s.gps ? s.gps.lng : zoneById(s.zoneId).lng;
            const critical =
              s.priority === "CRITICAL" ||

            const m = L.marker([lat, lng], {
              icon: divIcon(critical ? "#991b1b" : "#d97706", "🆘", critical),
            }).addTo(reg.layer);
            m.bindPopup(
              `<b>🆘 ${s.id}</b>${s.name ? " — " + s.name : ""}${s.age ? " (" + s.age + " yrs)" : ""}<br>${s.people} people · ${s.types.join(", ")}<br>Priority: <b>${s.priority}</b><br>${s.photo ? `<img src="${s.photo}" style="width:100px;border-radius:6px;margin-top:6px">` : ""}`,
            );
            if (critical && s.route) {
              const line = L.polyline(s.route.coords, {
                color: "#dc2626",
                weight: 4,
                dashArray: s.route.real ? null : "8 6",
              }).addTo(reg.layer);
              L.marker([s.route.destLat, s.route.destLng], {
                icon: divIcon("#16a34a", "🏥", false),
              })
                .addTo(reg.layer)
                .bindPopup(
                  `<b>Route target:</b> ${s.route.destName}<br>${s.route.distanceKm.toFixed(1)} km`,
                );
            }
          });

      function buildRiskView() {
        const v = el(`<div class="view" id="view-risk"></div>`);
        v.innerHTML = `

    <p class="page-sub">Flood · Flash Flood · Landslide · Cyclone · Heavy Rainfall · Urban Flooding · Forest Fire · Extreme Heat. This is a transparent rule-based scoring model (a real deployment would train a classifier on historical sensor data) — select a hazard, enter live conditions, and run the assessment.</p>
    <div class="pill-row" id="hazardPills"></div>
    <div class="two-col">

      const HAZARD_FIELDS = {
        flood: [
          ["rainfall", "Rainfall (mm, 24h)", 150],

          ["soilMoisture", "Soil Moisture (%)", 60],

        ],

      let currentHazard = "flood";
      function renderHazardPills() {
        const host = document.getElementById("hazardPills");
        host.innerHTML = HAZARDS.map(
          (h) =>
            `<button class="pill ${h.id === currentHazard ? "active" : ""}" data-h="${h.id}" type="button">${h.icon} ${h.label}</button>`,
        ).join("");
      }
      function renderRiskInputs() {
        const zoneSel = document.getElementById("riskZone");
        if (zoneSel && !zoneSel.options.length) {
          zoneSel.innerHTML = STATE.zones
            .map((z) => `<option value="${z.id}">${z.name}</option>`)
            .join("");
        }
        const host = document.getElementById("riskInputs");
        const fields = HAZARD_FIELDS[currentHazard];
        host.innerHTML = fields
          .map(
            (f) =>
              `<label>${f[1]}</label><input type="number" step="0.1" id="rf_${f[0]}" value="${f[2]}">`,
          )
          .join("");
      }
      function bindRiskEngine() {
        // delegated: pills live inside #hazardPills which never gets replaced wholesale after init
        document
          .getElementById("hazardPills")
          .addEventListener("click", (e) => {
            const btn = e.target.closest(".pill");
            if (!btn) return;
            currentHazard = btn.dataset.h;
            renderHazardPills();
            renderRiskInputs();
          });
        document.getElementById("runRiskBtn").addEventListener("click", () => {
          const zoneId = document.getElementById("riskZone").value;
          const fields = HAZARD_FIELDS[currentHazard];
          const inputs = {};
          fields.forEach((f) => {
            inputs[f[0]] =
              parseFloat(document.getElementById("rf_" + f[0]).value) || 0;
          });
          const { score, level } = computeRisk(currentHazard, inputs);
          const zone = zoneById(zoneId);
          zone.riskScore = score;
          zone.riskLevel = level;
          zone.hazard = HAZARDS.find((h) => h.id === currentHazard).label;
          STATE.riskHistory.push({
            t: new Date().toLocaleTimeString(),
            zoneId,
            hazard: zone.hazard,
            score,
            level,
          });
          STATE.riskHistory = STATE.riskHistory.slice(-40);

          const actions = recommendedActions(level);
          const resultHost = document.getElementById("riskResult");
          resultHost.innerHTML = `
      <div class="risk-gauge">
        <div class="score" style="color:${riskColor(level)}">${score}<span style="font-size:16px;color:var(--muted)">/100</span></div>
        <div class="lvl"><span class="badge b-${level}">${level} RISK</span></div>
        <div class="small muted" style="margin-top:6px">${zone.name} · ${zone.hazard}</div>
      </div>
      <div class="hr"></div>
      <b class="small">Recommended Actions</b>
      <ul class="small">${actions.map((a) => `<li>${a}</li>`).join("")}</ul>
      ${level === "HIGH" || level === "CRITICAL" ? `<button class="btn bad block" id="issueAlertBtn" type="button">🚨 Issue Early Warning Alert for ${zone.name}</button>` : `<p class="small muted">Risk is below the alert threshold — no warning issued.</p>`}
    `;
          pushLog(
            `Risk analysis run for <b>${zone.name}</b> (${zone.hazard}): score ${score} → <b>${level}</b>`,
          );
          if (level === "HIGH" || level === "CRITICAL") {
            document
              .getElementById("issueAlertBtn")
              .addEventListener("click", () => {
                issueAlert(zone, level, score, currentHazard);
                toast("Emergency alert issued for " + zone.name, "🚨", level);
              });
          }
          saveState();
          renderDashboard();
        });
      }
      function issueAlert(zone, level, score, hazardId) {
        const hz = HAZARDS.find((h) => h.id === hazardId);
        const id = "AL-" + Math.floor(1000 + Math.random() * 9000);
        STATE.alerts.unshift({
          id,
          zoneId: zone.id,
          level,
          score,
          hazard: hz.label,
          icon: hz.icon,
          title: `${hz.label.toUpperCase()} WARNING — ${zone.name}`,
          message: `AI risk score ${score}/100 (${level}). Residents in ${zone.name} advised to follow evacuation guidance and move to the nearest safe shelter.`,
          time: new Date().toLocaleString(),
        });
        pushLog(
          `🚨 Alert <b>${id}</b> issued for <b>${zone.name}</b> — ${level}`,
        );
        if (level === "CRITICAL") Siren.start();
        saveState();
        renderAlerts();
        renderDashboard();
      }

      /* ========================= SOS (with live GPS, photo, age) ========================= */
      function buildSosView() {

        v.innerHTML = `

      let selectedSosTypes = new Set();
      let capturedGps = null;
      let capturedPhoto = null;
      function bindSos() {
        const zoneSel = document.getElementById("sosZone");
        zoneSel.innerHTML = STATE.zones
          .map((z) => `<option value="${z.id}">${z.name}</option>`)
          .join("");

        document.getElementById("sosTypes").addEventListener("click", (e) => {
          const p = e.target.closest(".check-pill");
          if (!p) return;
          const t = p.dataset.t;
          if (selectedSosTypes.has(t)) {
            selectedSosTypes.delete(t);
            p.classList.remove("on");
          } else {
            selectedSosTypes.add(t);
            p.classList.add("on");
          }
        });

        document.getElementById("gpsBtn").addEventListener("click", () => {
          const statusEl = document.getElementById("gpsStatus");
          if (!navigator.geolocation) {
            statusEl.textContent = "Geolocation not supported by this browser.";
            return;
          }
          statusEl.textContent = "Requesting location permission…";
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              capturedGps = {
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                accuracy: pos.coords.accuracy,
              };
              statusEl.innerHTML = `✅ Live location captured (±${Math.round(pos.coords.accuracy)}m): ${capturedGps.lat.toFixed(5)}, ${capturedGps.lng.toFixed(5)}`;
            },
            (err) => {
              statusEl.textContent =
                "Could not get location: " +
                err.message +
                " (you can still submit using the Zone selector).";
            },
            { enableHighAccuracy: true, timeout: 10000 },
          );
        });

        document.getElementById("sosPhoto").addEventListener("change", (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            capturedPhoto = reader.result;
            const img = document.getElementById("sosPhotoPreview");
            img.src = capturedPhoto;
            img.style.display = "block";
          };
          reader.readAsDataURL(file);
        });

        document.getElementById("sendSosBtn").addEventListener("click", () => {
          const name =
            document.getElementById("sosName").value.trim() || "Anonymous";
          const age = document.getElementById("sosAge").value.trim();
          const phone = document.getElementById("sosPhone").value.trim();
          const zoneId = document.getElementById("sosZone").value;
          const people =
            parseInt(document.getElementById("sosPeople").value) || 1;
          const msg = document.getElementById("sosMsg").value.trim();
          const medicalAssist = document.getElementById("sosMedical").checked;
          const types = Array.from(selectedSosTypes);
          if (types.length === 0) {
            toast("Please select at least one emergency type", "⚠️");
            return;
          }

          let priority = "MEDIUM";
          if (
            types.includes("Trapped") ||
            types.includes("Medical") ||
            types.includes("Missing Person") ||
            medicalAssist
          )
            priority = "HIGH";
          const zone = zoneById(zoneId);
          if (
            (zone.riskLevel === "CRITICAL" && priority === "HIGH") ||
            (medicalAssist && types.includes("Trapped"))
          )
            priority = "CRITICAL";

          STATE.sosCounter++;
          const id = "SOS-" + STATE.sosCounter;
          const nearestTeam =
            STATE.teams.find(
              (t) => t.zoneId === zoneId && t.status === "available",
            ) || STATE.teams.find((t) => t.status === "available");

          const record = {
            id,
            name,
            age: age || null,
            phone,
            zoneId,
            people,
            types,
            message: msg,
            priority,
            status: "waiting",
            assignedTeam: null,
            time: new Date().toLocaleString(),
            medicalAssist,
            gps: capturedGps,
            photo: capturedPhoto,
            route: null,
          };

          // if this is a critical/medical case with a live GPS fix, route to the nearest hospital immediately
          if (
            (priority === "CRITICAL" ||
              (priority === "HIGH" && medicalAssist)) &&
            capturedGps
          ) {
            const dest = nearestFacility(
              capturedGps.lat,
              capturedGps.lng,
              STATE.hospitals,
            );
            if (dest) {
              record.route = {
                coords: [
                  [capturedGps.lat, capturedGps.lng],
                  [dest.lat, dest.lng],
                ],
                destName: dest.name,
                destLat: dest.lat,
                destLng: dest.lng,
                distanceKm: dest.distanceKm,
                real: false,
              };
              tryRealRoute(
                capturedGps.lat,
                capturedGps.lng,
                dest.lat,
                dest.lng,
              ).then((coords) => {
                if (coords && coords.length) {
                  record.route.coords = coords;
                  record.route.real = true;
                  saveState();
                  renderMap("map-main");
                  renderMap("map-dash");
                }
              });
            }
            Siren.start();
          }

          STATE.sos.unshift(record);
          pushLog(
            `🆘 New SOS <b>${id}</b> from <b>${name}</b> in <b>${zone.name}</b> — priority ${priority}${medicalAssist ? " · MEDICAL" : ""}`,
          );
          saveState();

          document.getElementById("sosConfirm").innerHTML = `
      <div class="alert-item ${priority}">
        <b>✅ SOS REQUEST SENT</b>
        <div class="small">Request ID: <b>${id}</b></div>
        <div class="small">Priority: <span class="badge b-${priority}">${priority}</span></div>
        <div class="small">Zone: ${zone.name}</div>
        <div class="small">Live GPS: ${capturedGps ? capturedGps.lat.toFixed(5) + ", " + capturedGps.lng.toFixed(5) : "Not captured — using zone location"}</div>

      // Attempts a real road route via the public OSRM demo API; falls back to the straight line already set.
      async function tryRealRoute(lat1, lng1, lat2, lng2) {
        try {
          const url = `https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=full&geometries=geojson`;
          const res = await fetch(url);
          if (!res.ok) return null;
          const data = await res.json();
          const geom =
            data &&
            data.routes &&
            data.routes[0] &&
            data.routes[0].geometry &&
            data.routes[0].geometry.coordinates;
          if (!geom) return null;
          return geom.map((c) => [c[1], c[0]]);
        } catch (e) {
          return null;
        } // offline / blocked — the straight-line fallback already drawn stays in place
      }

        }
        addMsg(
          "Hi, I'm the RakshaNet-X Disaster Assistant. Ask me about shelters, alerts, or safety tips.",
          "bot",
        );
        function send(q) {
          if (!q.trim()) return;
          addMsg(q, "me");
          setTimeout(() => addMsg(botReply(q), "bot"), 250);
          document.getElementById("chatInput").value = "";
        }
        document
          .getElementById("chatSendBtn")
          .addEventListener("click", () =>
            send(document.getElementById("chatInput").value),
          );
        document
          .getElementById("chatInput")
          .addEventListener("keydown", (e) => {
            if (e.key === "Enter") send(e.target.value);
          });
        document
          .querySelector("#view-assistant .pill-row")
          .addEventListener("click", (e) => {
            const p = e.target.closest(".pill[data-q]");
            if (!p) return;
            send(p.dataset.q);
          });
      }

      /* ---------------------------- GLOBAL DELEGATED CLICK HANDLER ----------------------------
   Handles all dynamically-rendered table/card action buttons in one place so nothing
   ever goes "stuck" after a re-render replaces innerHTML. */
      document.addEventListener("click", function (e) {
        const t = e.target;
        const assignBtn = t.closest('[data-act="assign"]');
        if (assignBtn) {
          assignTeam(assignBtn.dataset.id);
          return;
        }
        const rescueBtn = t.closest('[data-act="rescue"]');
        if (rescueBtn) {
          markRescued(rescueBtn.dataset.id);
          return;
        }
        const shelterBtn = t.closest("button[data-a]");
        if (shelterBtn) {
          const s = shelterById(shelterBtn.dataset.id);
          s.occupied = Math.max(
            0,
            Math.min(s.capacity, s.occupied + parseInt(shelterBtn.dataset.a)),
          );
          saveState();
          renderShelters();
          renderDashboard();
          return;
        }
      });

      /* ---------------------------- INIT ---------------------------- */
      function renderAll() {
        try {
          renderDashboard();
        } catch (e) {
          console.error("dashboard", e);
        }
        try {
          renderHazardPills();
          renderRiskInputs();
        } catch (e) {
          console.error("risk", e);
        }
        try {
          renderMap("map-main");
        } catch (e) {
          console.error("map", e);
        }
        try {
          renderAlerts();
        } catch (e) {
          console.error("alerts", e);
        }
        try {
          renderSosHistory();
        } catch (e) {
          console.error("sos", e);
        }
        try {
          renderRescue();
        } catch (e) {
          console.error("rescue", e);
        }
        try {
          renderShelters();
        } catch (e) {
          console.error("shelters", e);
        }
        try {
          renderRelief();
        } catch (e) {
          console.error("relief", e);
        }
        try {
          renderEvac();
        } catch (e) {
          console.error("evac", e);
        }
        try {
          renderRecovery();
        } catch (e) {
          console.error("recovery", e);
        }
      }

      buildTabs();
      buildViews();
      bindRiskEngine();
      bindAlerts();
      bindSos();
      bindRelief();
      bindEvac();
      bindAssistant();
      renderAll();
      showView("dashboard");
    </script>
  </body>
</html>
